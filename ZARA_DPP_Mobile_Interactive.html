function go(page){current=page;menu.hidden=true;back.hidden=page==='home';window.location.hash=page==='home'?'':page;render();window.scrollTo(0,0)}
function render(){if(current==='home'){screen.innerHTML=`<h1 class="page-title">Digital Product Passport</h1><section class="hero"><div class="product"><img src="${ASSETS.shirt}" alt="White cotton T-shirt"><div><div class="product-name">Cotton T-shirt</div><div class="product-id">ID: ZR-TS001</div></div></div></section><section class="content"><div class="info"><div class="symbol">${icons.leaf}</div><div><div class="caption">Total Carbon Footprint</div><div class="big">10.0 kg CO₂e</div></div></div><div class="info car"><div class="symbol">${icons.car}</div><div class="caption">≈ the same as<br>driving <strong>about 40 km</strong></div></div>${[['journey','pin','Product Journey'],['materials','layers','Materials'],['verification','shield','Data & Verification']].map(x=>`<button class="navitem" data-go="${x[0]}">${icons[x[1]]}<span>${x[2]}</span><span class="chev">${icons.chev}</span></button>`).join('')}<p class="note">Illustrative Digital Product Passport prototype for academic presentation. Carbon figures are sample values.</p></section>`}
if(current==='journey'){let steps=[['Raw Material Sourcing','cotton','Origin: Turkey','Material: Cotton','Emissions: 4.2 kg CO₂e'],['Manufacturing','factory','Location: Portugal','Process: Fabric production & garment assembly','Emissions: 3.5 kg CO₂e'],['Transportation','ship','Mode: Sea freight','Distance: ~10,000 km','Emissions: 1.8 kg CO₂e'],['Distribution','warehouse','Location: Spain (Distribution Centre)','Process: Warehousing & delivery','Emissions: 0.5 kg CO₂e']];screen.innerHTML=`<div class="subpage"><div class="ribbon">Product Journey</div><div class="journey">${steps.map((s,i)=>`<article class="step"><div class="step-head"><span class="num">0${i+1}</span>${s[0]}</div><img src="${ASSETS[s[1]]}" alt="${s[0]}"><div class="step-details">${s.slice(2).map(t=>`<div>${t.replace(/^([^:]+):/, '<b>$1:</b>')}</div>`).join('')}</div></article>`).join('')}</div></div>`}
if(current==='materials'){let rows=[['Raw Materials','4.2 kg CO₂e (42%)','#103f72'],['Manufacturing','3.5 kg CO₂e (35%)','#4f85bd'],['Transportation','1.8 kg CO₂e (18%)','#8ebce9'],['Distribution','0.5 kg CO₂e (5%)','#d2e5f7']];screen.innerHTML=`<div class="subpage"><div class="ribbon">Materials</div><div class="section-name">Supply Chain Carbon Footprint</div><div class="donut"><div class="donut-inner"><strong>10.0</strong><b>kg CO₂e</b><small>Total</small></div></div><div class="legend">${rows.map(r=>`<div class="legend-row"><span class="swatch" style="background:${r[2]}"></span><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join('')}</div><div class="callout"><b>◎ Emission Source Identified</b>Raw materials account for the largest share (42%) of this T-shirt’s emissions.</div></div>`}
if(current==='verification'){screen.innerHTML=`<div class="subpage"><div class="ribbon">Data & Verification</div><div class="verifybox"><h3>▤ &nbsp; Actual Supplier Data</h3><p>Material use, energy consumption and freight records from suppliers across the supply chain.</p></div><div class="plus">+</div><div class="verifybox"><h3>♢ &nbsp; Third-Party Verification</h3><p>Independent verification of supplier records and carbon information (e.g., SGS, BSI).</p></div><div class="section-name">Data Reliability</div>${['Actual supplier records','Standardised carbon footprint calculation','Independent third-party assurance'].map(t=>`<div class="checkrow"><span class="check">✓</span>${t}</div>`).join('')}<p class="note">This is a conceptual verification workflow, not a claim that the example product has been independently certified.</p></div>`}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-go]');if(target)go(target.dataset.go)});back.onclick=()=>go('home');document.getElementById('menubtn').onclick=()=>menu.hidden=!menu.hidden;document.getElementById('closemenu').onclick=()=>menu.hidden=true;window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(['home','journey','materials','verification'].includes(p)||!p){current=p||'home';back.hidden=current==='home';render()}});current=['journey','materials','verification'].includes(location.hash.slice(1))?location.hash.slice(1):'home';back.hidden=current==='home';render();
</script></body></html>
